[project]
name = "korea-finance-factcheck"
version = "0.1.0"
description = "MCP server that checks numbers in Korean finance writing against DART, Bank of Korea ECOS and US Treasury data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "requests>=2.31"]

[project.scripts]
korea-finance-factcheck = "korea_finance_factcheck.server:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korea_finance_factcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
